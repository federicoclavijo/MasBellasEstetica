<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>+Bellas · Administración</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:wght@400;500;600;700&display=swap">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <!-- Inicio de sesión (sin registro: hay un único administrador) -->
  <main id="vista-login" class="login" hidden>
    <div class="login__card card">
      <a class="brand" href="/" aria-label="Volver al sitio"><span class="brand__plus" aria-hidden="true">+</span><span class="brand__name">Bellas</span></a>
      <h1>Administración</h1>
      <p class="login__sub">Ingresa con tu usuario para gestionar reservas, especialistas y servicios.</p>
      <div id="login-aviso" role="alert" hidden></div>
      <form id="form-login" novalidate>
        <div class="field">
          <label class="field__label" for="login-user">Usuario</label>
          <input class="input" id="login-user" name="user" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label class="field__label" for="login-pass">Contraseña</label>
          <div class="pass">
            <input class="input" id="login-pass" name="pass" type="password" autocomplete="current-password" required>
            <button type="button" class="pass__toggle" id="toggle-pass" aria-controls="login-pass" aria-pressed="false">Mostrar</button>
          </div>
        </div>
        <button class="btn btn--primary btn--block" type="submit" id="btn-login">Iniciar sesión</button>
      </form>
      <a class="login__back" href="/">← Volver a reservas</a>
    </div>
  </main>

  <!-- Panel -->
  <div id="vista-panel" hidden>
    <header class="panel-header">
      <a class="brand" href="/" aria-label="Ver sitio público"><span class="brand__plus" aria-hidden="true">+</span><span class="brand__name">Bellas</span><span class="brand__tag">Panel</span></a>
      <nav class="tabs" aria-label="Secciones" id="tabs">
        <button type="button" class="tab" data-seccion="reservas" aria-current="page">Reservas</button>
        <button type="button" class="tab" data-seccion="especialistas">Especialistas</button>
        <button type="button" class="tab" data-seccion="servicios">Servicios</button>
      </nav>
      <button type="button" class="btn btn--ghost btn--sm" id="btn-logout">Cerrar sesión</button>
    </header>
    <main class="panel container" id="panel-contenido" tabindex="-1" aria-live="polite"></main>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
